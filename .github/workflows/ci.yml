name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qiskit,cirq]"

      - name: Unit + interop tests
        run: python -m pytest tests/ -q --ignore=tests/test_api.py

      - name: Algorithm audit (textbook + real-world corpus)
        run: python -m benchmarks.run_audit
