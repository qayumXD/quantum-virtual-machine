<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QVM Simulator - IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-panel: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #2f81f7;
            --accent-hover: #1f6feb;
            --btn-text: #ffffff;
            --code-bg: #0d1117;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-base: #ffffff;
            --bg-panel: #f6f8fa;
            --border-color: #d0d7de;
            --text-main: #24292f;
            --text-muted: #57606a;
            --accent: #0969da;
            --accent-hover: #0349b4;
            --code-bg: #f6f8fa;
            --btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            font-size: 14px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 4px;
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-panel);
            color: var(--text-main);
            transition: all 0.2s;
        }

        button.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--btn-text);
        }

        button.primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        button:hover:not(.primary) {
            background-color: var(--border-color);
        }

        /* Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .panel-left {
            border-right: 1px solid var(--border-color);
            flex: 1.2;
        }

        .panel-right {
            flex: 1;
            background-color: var(--bg-base);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }
        
        .panel-far-right {
            flex: 1;
            background-color: var(--bg-base);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            height: 36px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Editor */
        .editor-container {
            flex: 1;
            padding: 16px;
            background-color: var(--code-bg);
            overflow-y: auto;
        }

        textarea.code-editor {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        /* Content Areas */
        .content-scrollable {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-panel);
            padding: 16px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Config */
        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .config-row.checkbox-row {
            justify-content: flex-start;
            gap: 8px;
        }

        select, input[type="number"] {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-code);
            font-size: 12px;
            outline: none;
        }
        
        input[type="checkbox"] {
            accent-color: var(--accent);
        }

        /* Images & Data */
        .viz-img-container {
            width: 100%;
            text-align: center;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .viz-img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
            filter: var(--img-filter);
        }

        [data-theme="dark"] .viz-img-container img {
            /* Invert matplotlib images slightly for dark mode, since they generate with white backgrounds */
            filter: invert(0.9) hue-rotate(180deg);
        }

        pre {
            background: var(--bg-base);
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            overflow: auto;
            max-height: 200px;
            font-family: var(--font-code);
            font-size: 12px;
            white-space: pre-wrap;
        }

    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <span>QVM v0.3.1</span>
            <span style="color: var(--text-muted); font-weight: 400;">Workspace</span>
        </div>
        <div class="nav-right">
            <span id="statusEl" style="font-size: 12px; margin-right: 12px;"></span>
            <button onclick="toggleTheme()">Toggle Theme</button>
            <button class="primary" onclick="runSimulation()">Run Simulation</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Left Panel: Editor -->
        <div class="panel panel-left">
            <div class="panel-header">OpenQASM 3.0 Editor</div>
            <div class="editor-container">
                <textarea class="code-editor" id="qasmInput" spellcheck="false">OPENQASM 3.0;
qubit[2] q;
bit[2] c;

// Bell State
h q[0];
cx q[0], q[1];

// Measurement
c[0] = measure q[0];
c[1] = measure q[1];</textarea>
            </div>
        </div>

        <!-- Middle Panel: Config & Raw Data -->
        <div class="panel panel-right">
            <div class="panel-header">Configuration & Raw Data</div>
            <div class="content-scrollable">
                
                <div class="card">
                    <div class="card-title">Run Configuration</div>
                    <div class="config-row">
                        <label>Engine</label>
                        <select id="engineSelect">
                            <option value="statevector">Statevector (Exact)</option>
                            <option value="density_matrix">Density Matrix (Noise)</option>
                            <option value="mps">MPS (Large-Scale)</option>
                        </select>
                    </div>
                    <div class="config-row">
                        <label>Shots</label>
                        <input type="number" id="shotsInput" value="1000" min="1" max="10000">
                    </div>
                    <div class="config-row">
                        <label>Seed (Optional)</label>
                        <input type="number" id="seedInput" placeholder="Random">
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 0;">
                    <div class="config-row checkbox-row">
                        <input type="checkbox" id="transpileCheck" checked>
                        <label for="transpileCheck">Enable Transpilation</label>
                    </div>
                    <div class="config-row">
                        <label>Routing Strategy</label>
                        <select id="routingSelect">
                            <option value="sabre">SABRE (Heuristic)</option>
                            <option value="greedy">Greedy (BFS)</option>
                        </select>
                    </div>
                    <div class="config-row checkbox-row">
                        <input type="checkbox" id="restoreMappingCheck" checked>
                        <label for="restoreMappingCheck">Restore Logical Mapping</label>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Classical Memory</div>
                    <pre id="memOutput">{}</pre>
                </div>
                
                <div class="card">
                    <div class="card-title">Probabilities</div>
                    <pre id="probOutput">[]</pre>
                </div>

                <div class="card">
                    <div class="card-title">Transpiled Operations</div>
                    <pre id="opsOutput">[]</pre>
                </div>

            </div>
        </div>
        
        <!-- Right Panel: Visualizations -->
        <div class="panel panel-far-right">
            <div class="panel-header">Visualizations</div>
            <div class="content-scrollable">
                
                <div class="card">
                    <div class="card-title">Circuit Topology</div>
                    <div class="viz-img-container" id="circuitViz">
                        <span style="color: var(--text-muted); font-size: 12px;">Run to generate diagram</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Probability Histogram</div>
                    <div class="viz-img-container" id="histViz">
                        <span style="color: var(--text-muted); font-size: 12px;">Run to generate plot</span>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        // API Base URL (Render deployment)
        const API_URL = "https://quantum-virtual-machine.onrender.com";

        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
            }
        }

        async function runSimulation() {
            const qasm = document.getElementById('qasmInput').value;
            const engine = document.getElementById('engineSelect').value;
            const shots = parseInt(document.getElementById('shotsInput').value);
            const seedRaw = document.getElementById('seedInput').value;
            const seed = seedRaw ? parseInt(seedRaw) : null;
            const transpile = document.getElementById('transpileCheck').checked;
            const routing = document.getElementById('routingSelect').value;
            const restoreMapping = document.getElementById('restoreMappingCheck').checked;
            
            const statusEl = document.getElementById('statusEl');

            statusEl.innerText = "⚙️ Executing on Render...";
            statusEl.style.color = "var(--text-muted)";

            try {
                const response = await fetch(`${API_URL}/run`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_type: "qasm",
                        qasm: qasm,
                        engine: engine,
                        shots: shots,
                        seed: seed,
                        transpile: transpile,
                        routing: routing,
                        restore_mapping: restoreMapping
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Simulation failed');
                }

                // Update Raw Data
                document.getElementById('memOutput').innerText = JSON.stringify(data.classical_memory, null, 2);
                document.getElementById('probOutput').innerText = JSON.stringify(data.probabilities, null, 2);
                document.getElementById('opsOutput').innerText = JSON.stringify(data.transpiled_operations, null, 2);
                
                // Update Visualizations
                if (data.circuit_plot) {
                    document.getElementById("circuitViz").innerHTML = `<img src="data:image/png;base64,${data.circuit_plot}">`;
                }
                if (data.histogram_plot) {
                    document.getElementById("histViz").innerHTML = `<img src="data:image/png;base64,${data.histogram_plot}">`;
                }

                statusEl.innerText = `✅ Success (${data.execution_time_ms || '<1'}ms)`;
                statusEl.style.color = "#3fb950"; // Git green

            } catch (error) {
                statusEl.innerText = `❌ ${error.message}`;
                statusEl.style.color = "#f85149"; // Git red
            }
        }
    </script>
</body>
</html>
