<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QVM Web UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 960px; }
    header { margin-bottom: 16px; }
    fieldset { margin-bottom: 16px; }
    textarea { width: 100%; min-height: 140px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > label { flex: 1 1 220px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
    .small { font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Quantum Virtual Machine (QVM) – Web UI</h1>
    <p class="small">Runs against the local API. Start server: <code>python -m src.qvm.server</code> (default localhost:8000).</p>
  </header>

  <fieldset>
    <legend>Input</legend>
    <div class="row">
      <label>API URL<br/><input id="api-url" value="http://127.0.0.1:8000/run" style="width:100%"></label>
      <label>Source Type<br/>
        <select id="source-type">
          <option value="json">JSON gate list</option>
          <option value="qasm">OpenQASM 2.0</option>
        </select>
      </label>
      <label>Qubits (for JSON)<br/><input id="nqubits" type="number" value="2" min="1" style="width:100%"></label>
    </div>
    <label>JSON gates or QASM text</label>
    <textarea id="circuit-input">[
  {"name":"h","qubits":[0]},
  {"name":"cx","qubits":[0,1]}
]</textarea>
  </fieldset>

  <fieldset>
    <legend>Options</legend>
    <div class="row">
      <label>Transpile <input id="transpile" type="checkbox"></label>
      <label>Routing
        <select id="routing">
          <option value="greedy">greedy</option>
          <option value="sabre">sabre</option>
        </select>
      </label>
      <label>Restore mapping <input id="restore-mapping" type="checkbox" checked></label>
      <label>Shots <input id="shots" type="number" value="0" min="0" style="width:100%"></label>
      <label>Seed <input id="seed" type="number" value="" style="width:100%"></label>
      <label>Depol p <input id="depol" type="number" value="0" min="0" max="1" step="0.01" style="width:100%"></label>
      <label>Readout p <input id="readout" type="number" value="0" min="0" max="1" step="0.01" style="width:100%"></label>
      <label>Collapse <input id="collapse" type="checkbox"></label>
    </div>
  </fieldset>

  <button id="run-btn">Run</button>
  <span id="status" class="small"></span>

  <h3>Probabilities</h3>
  <pre id="prob-output">(run to view)</pre>

  <h3>Counts</h3>
  <pre id="count-output">(run with shots>0)</pre>

  <h3>Transpiled Ops</h3>
  <pre id="ops-output">(shown after run)</pre>

  <script>
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");

    runBtn.onclick = async () => {
      statusEl.textContent = "Running...";
      const sourceType = document.getElementById("source-type").value;
      const payload = {
        source_type: sourceType,
        transpile: document.getElementById("transpile").checked,
        routing: document.getElementById("routing").value,
        restore_mapping: document.getElementById("restore-mapping").checked,
        shots: Number(document.getElementById("shots").value) || 0,
        seed: document.getElementById("seed").value ? Number(document.getElementById("seed").value) : null,
        noise_depol: Number(document.getElementById("depol").value) || 0,
        noise_readout: Number(document.getElementById("readout").value) || 0,
        collapse: document.getElementById("collapse").checked,
      };

      const text = document.getElementById("circuit-input").value;
      if (sourceType === "json") {
        try {
          payload.circuit = JSON.parse(text);
        } catch (e) {
          statusEl.textContent = "Invalid JSON";
          return;
        }
        payload.nqubits = Number(document.getElementById("nqubits").value);
      } else {
        payload.qasm = text;
      }

      try {
        const resp = await fetch(document.getElementById("api-url").value, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) throw new Error(await resp.text());
        const data = await resp.json();
        document.getElementById("prob-output").textContent = JSON.stringify(data.probabilities, null, 2);
        document.getElementById("count-output").textContent = JSON.stringify(data.counts, null, 2);
        document.getElementById("ops-output").textContent = JSON.stringify(data.transpiled_operations, null, 2);
        statusEl.textContent = "Done";
      } catch (err) {
        statusEl.textContent = "Error: " + err;
      }
    };
  </script>
</body>
</html>
